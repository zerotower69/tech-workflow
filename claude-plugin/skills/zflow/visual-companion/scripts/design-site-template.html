<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>技术塔 · 设计交付站</title>
  <style>
    :root{color-scheme:light;--ink:#172033;--muted:#697187;--line:#e3e7ef;--panel:#fff;--canvas:#f4f6fa;--brand:#5368f5;--brand-soft:#eef1ff;--success:#16a270;--shadow:0 14px 44px rgba(31,42,68,.12)}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--canvas)}button{font:inherit;color:inherit}a{color:var(--brand)}
    .shell{height:100%;display:grid;grid-template-columns:290px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
    .topbar{grid-column:1/-1;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:24px;padding:14px 22px;z-index:3}
    .brand{display:flex;align-items:center;gap:12px}.mark{width:36px;height:36px;border-radius:12px;background:linear-gradient(145deg,#6d7cff,#4457e8);color:#fff;display:grid;place-items:center;font-weight:800;box-shadow:0 8px 20px rgba(83,104,245,.3)}h1{font-size:17px;margin:0}.sub{color:var(--muted);font-size:12px}.meta{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 9px;color:var(--muted);font-size:12px}
    aside{background:var(--panel);border-right:1px solid var(--line);min-height:0;display:flex;flex-direction:column}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:14px}.tab{border:0;border-radius:10px;padding:9px;background:#f3f5f8;cursor:pointer}.tab.active{background:var(--brand-soft);color:var(--brand);font-weight:700}.search{margin:0 14px 10px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:calc(100% - 28px);outline:none}.search:focus{border-color:var(--brand)}
    .page-list{overflow:auto;padding:0 10px 14px}.page-button{width:100%;border:0;background:transparent;border-radius:12px;padding:10px;display:grid;grid-template-columns:34px 1fr;gap:10px;text-align:left;cursor:pointer;margin:2px 0}.page-button:hover{background:#f5f6f9}.page-button.active{background:var(--brand-soft);color:var(--brand)}.page-no{width:32px;height:32px;border-radius:9px;background:#edf0f5;display:grid;place-items:center;font-size:12px}.page-button.active .page-no{background:var(--brand);color:#fff}.page-name{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.page-size{font-size:11px;color:var(--muted)}
    .aside-foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 14px;color:var(--muted);font-size:11px}
    main{min-width:0;min-height:0;padding:18px;overflow:hidden}.view{height:100%;display:none}.view.active{display:flex;flex-direction:column}.viewer-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:10px}.viewer-title{font-weight:700}.open-page{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;text-decoration:none;color:var(--ink)}
    .frame-wrap{min-height:0;flex:1;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.frame-wrap iframe{width:100%;height:100%;border:0;background:#fff}
    .decision-layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;min-height:0;overflow:auto;padding-right:2px}.markdown,.analytics{background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(20px,3vw,38px)}.markdown{max-width:900px;width:100%;margin:0 auto}.markdown h1,.markdown h2,.markdown h3{line-height:1.25;margin-top:1.6em}.markdown h1{font-size:28px;margin-top:0}.markdown h2{font-size:21px;border-bottom:1px solid var(--line);padding-bottom:8px}.markdown pre{overflow:auto;background:#151823;color:#f7f8fa;border-radius:12px;padding:14px}.markdown code{background:#f1f3f7;border-radius:5px;padding:2px 5px}.markdown pre code{background:transparent;padding:0}.markdown blockquote{margin-left:0;border-left:4px solid var(--brand);background:var(--brand-soft);padding:10px 14px;color:#4e5872}.markdown img{max-width:100%}.empty{padding:40px;text-align:center;color:var(--muted)}
    .analytics{padding:18px;height:max-content}.analytics h2{font-size:14px;margin:0 0 12px}.metric{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.metric:last-child{border-bottom:0}.metric b{font-variant-numeric:tabular-nums}.analytics-note{font-size:11px;color:var(--muted);margin-top:12px}
    @media(max-width:820px){.shell{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr)}.topbar{padding:11px 14px}.meta{display:none}aside{border-right:0;border-bottom:1px solid var(--line);max-height:220px}.page-list{display:flex;overflow:auto}.page-button{min-width:210px}.aside-foot,.search{display:none}main{padding:10px}.decision-layout{grid-template-columns:1fr}.analytics{order:-1}.frame-wrap{border-radius:12px}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><div class="mark">TT</div><div><h1 id="site-title">设计交付站</h1><div class="sub" id="session-label"></div></div></div>
      <div class="meta" id="site-meta"></div>
    </header>
    <aside>
      <div class="tabs"><button class="tab active" data-mode="pages">设计页面</button><button class="tab" data-mode="decisions">设计决策</button></div>
      <input class="search" id="page-search" placeholder="筛选页面…" autocomplete="off">
      <nav class="page-list" id="page-list" aria-label="设计页面"></nav>
      <div class="aside-foot">静态站点 · Express 本地预览 · 页面可单独打开</div>
    </aside>
    <main>
      <section class="view active" id="pages-view">
        <div class="viewer-head"><div class="viewer-title" id="viewer-title">请选择页面</div><a class="open-page" id="open-page" target="_blank" rel="noopener">单独打开 ↗</a></div>
        <div class="frame-wrap"><iframe id="page-frame" title="设计页面预览" sandbox="allow-scripts allow-forms allow-popups"></iframe></div>
      </section>
      <section class="view" id="decisions-view">
        <div class="decision-layout">
          <article class="markdown" id="decisions-content"></article>
          <div class="analytics"><h2>会话分析摘要</h2><div id="analytics-list"></div><p class="analytics-note">仅展示聚合计数，不包含点击文案、页面源码或会话密钥。</p></div>
        </div>
      </section>
    </main>
  </div>
  <script>window.__TT_DESIGN_SITE__=<!--TT_SITE_DATA-->;</script>
  <script>
    (()=>{
      const site=window.__TT_DESIGN_SITE__;const list=document.querySelector('#page-list');const frame=document.querySelector('#page-frame');const title=document.querySelector('#viewer-title');const open=document.querySelector('#open-page');const search=document.querySelector('#page-search');
      document.title=site.title+' · 设计交付站';document.querySelector('#site-title').textContent=site.title;document.querySelector('#session-label').textContent=site.sessionLabel;document.querySelector('#decisions-content').innerHTML=site.decisionsHtml||'<div class="empty">当前会话还没有 design-spec.md 或其他设计决策文档。</div>';
      const meta=document.querySelector('#site-meta');[[site.pages.length+' 个页面','pages'],[site.decisionDocuments.length+' 份决策','decisions'],['导出 '+new Date(site.generatedAt).toLocaleString(),'time']].forEach(([text])=>{const el=document.createElement('span');el.className='pill';el.textContent=text;meta.appendChild(el)});
      const buttons=[];function selectPage(index){const page=site.pages[index];if(!page)return;buttons.forEach((button,i)=>button.classList.toggle('active',i===index));frame.src=page.href;title.textContent=page.name;open.href=page.href;history.replaceState(null,'','?page='+encodeURIComponent(page.name));}
      site.pages.forEach((page,index)=>{const button=document.createElement('button');button.className='page-button';button.type='button';button.dataset.name=page.name.toLowerCase();const no=document.createElement('span');no.className='page-no';no.textContent=String(index+1).padStart(2,'0');const copy=document.createElement('span');const name=document.createElement('span');name.className='page-name';name.textContent=page.name;const size=document.createElement('span');size.className='page-size';size.textContent=Math.max(1,Math.round(page.bytes/1024))+' KB · 独立 HTML';copy.append(name,size);button.append(no,copy);button.addEventListener('click',()=>selectPage(index));list.appendChild(button);buttons.push(button)});
      search.addEventListener('input',()=>{const query=search.value.trim().toLowerCase();buttons.forEach(button=>button.hidden=query&&!button.dataset.name.includes(query))});
      document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{const mode=tab.dataset.mode;document.querySelectorAll('.tab').forEach(item=>item.classList.toggle('active',item===tab));document.querySelector('#pages-view').classList.toggle('active',mode==='pages');document.querySelector('#decisions-view').classList.toggle('active',mode==='decisions');search.hidden=mode!=='pages';if(mode==='decisions')history.replaceState(null,'','?view=decisions')}));
      const analytics=document.querySelector('#analytics-list');const metrics=[['事件总数',site.analytics.total],...Object.entries(site.analytics.byType).sort((a,b)=>b[1]-a[1]).slice(0,10)];metrics.forEach(([label,value])=>{const row=document.createElement('div');row.className='metric';const key=document.createElement('span');key.textContent=label;const count=document.createElement('b');count.textContent=value;row.append(key,count);analytics.appendChild(row)});
      const params=new URLSearchParams(location.search);if(params.get('view')==='decisions')document.querySelector('[data-mode="decisions"]').click();else{const wanted=params.get('page');const index=Math.max(0,site.pages.findIndex(page=>page.name===wanted));selectPage(index)}
    })();
  </script>
</body>
</html>
